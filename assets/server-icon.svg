  <line x1="120" y1="232" x2="392" y2="232" stroke="#ffffff" stroke-width="10"/>
  <line x1="256" y1="112" x2="256" y2="232" stroke="#9fb6d9" stroke-width="8"/>
  <line x1="188" y1="232" x2="256" y2="172" stroke="#9fb6d9" stroke-width="8"/>
  <line x1="324" y1="232" x2="256" y2="172" stroke="#9fb6d9" stroke-width="8"/>
  <!-- lightning bolt -->
  <polygon points="282,248 206,330 252,330 228,404 316,306 268,306 298,248" fill="#ffc83d" stroke="#0f2140" stroke-width="6" stroke-linejoin="round"/>
